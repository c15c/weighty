name: WeightStreak

options:
  bundleIdPrefix: com.cisco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:

  WeightStreak:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cisco.weightstreak
        PRODUCT_NAME: WeightStreak
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/WeightStreak.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Weight Streak
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.cisco.weightstreak
            CFBundleURLSchemes:
              - weightstreak
    entitlements:
      path: App/WeightStreak.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cisco.weightstreak
    dependencies:
      - sdk: PhotosUI.framework
    preBuildScripts:
      - name: Diagnostics (temporary)
        basedOnDependencyAnalysis: false
        script: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          check() {
            name="$1"; shift
            out="/tmp/diag-$name.txt"
            xcrun swiftc -typecheck -parse-as-library -module-name "$name" -sdk "$SDK" \
              -target arm64-apple-ios17.0 -swift-version 5 $(find "$@" -name '*.swift') > "$out" 2>&1
            count=$(grep -c ': error: ' "$out")
            echo "::error::$name has $count error(s)"
            grep ': error: ' "$out" | sed -E "s#^$SRCROOT/##" | head -8 | sed "s/^/::error::$name /"
          }
          check App "$SRCROOT/App" "$SRCROOT/Shared"
          check Widget "$SRCROOT/Widget" "$SRCROOT/Shared"
          echo "::error::Diagnostic build, intentionally stopped"
          exit 1
    postBuildScripts:
      - name: Preserve entitlements for sideload signing
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphoneos" ] && [ "$CODE_SIGNING_ALLOWED" = "NO" ]; then
            APP="$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
            WIDGET="$APP/PlugIns/WeightStreakWidget.appex"

            if [ -d "$WIDGET" ]; then
              /usr/bin/codesign --force --sign - \
                --entitlements "$SRCROOT/Widget/WeightStreakWidget.entitlements" \
                --generate-entitlement-der \
                "$WIDGET"
            fi

            /usr/bin/codesign --force --sign - \
              --entitlements "$SRCROOT/App/WeightStreak.entitlements" \
              --generate-entitlement-der \
              "$APP"
          fi

  WeightStreakWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cisco.weightstreak.widget
        PRODUCT_NAME: WeightStreakWidget
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widget/WeightStreakWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Weight Streak
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/WeightStreakWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cisco.weightstreak

schemes:
  WeightStreak:
    build:
      targets:
        WeightStreak: all
    run:
      config: Debug
    archive:
      config: Release
