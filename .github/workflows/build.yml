name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project WeightStreak.xcodeproj \
            -scheme WeightStreak \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION=$VERSION \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeightStreak.app Payload/
          zip -qry WeightStreak.ipa Payload
          ls -lh WeightStreak.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" WeightStreak.ipa \
            --title "Weight Streak $VERSION" \
            --notes "Automated build $VERSION"

      - name: Update AltStore source
        run: |
          SIZE=$(stat -f%z WeightStreak.ipa)
          DATE=$(date -u +%Y-%m-%d)
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/WeightStreak.ipa"
          ICON="https://raw.githubusercontent.com/${{ github.repository }}/main/icon.png"

          cat > apps.json << EOF
          {
            "name": "Weight Streak",
            "identifier": "com.cisco.weightstreak.source",
            "apps": [
              {
                "name": "Weight Streak",
                "bundleIdentifier": "com.cisco.weightstreak",
                "developerName": "Cisco Sara",
                "subtitle": "Weigh-in streaks and widgets",
                "localizedDescription": "Daily weigh-in tracker with a streak counter, rolling average, goal progress and home screen widgets.",
                "iconURL": "$ICON",
                "tintColor": "#FFA452",
                "screenshotURLs": [],
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "localizedDescription": "Automated build $VERSION",
                    "downloadURL": "$URL",
                    "size": $SIZE,
                    "minOSVersion": "17.0"
                  }
                ]
              }
            ]
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Update AltStore source for $VERSION [skip ci]" || exit 0
          git pull --rebase
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeightStreak-ipa
          path: WeightStreak.ipa
          retention-days: 30
