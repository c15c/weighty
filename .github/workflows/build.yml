name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project WeightStreak.xcodeproj \
            -scheme WeightStreak \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeightStreak.app Payload/
          zip -qry WeightStreak.ipa Payload

      - name: Collect entitlements for re-signing
        run: |
          mkdir -p artifacts
          mv WeightStreak.ipa artifacts/
          cp App/WeightStreak.entitlements artifacts/
          cp Widget/WeightStreakWidget.entitlements artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeightStreak-ipa
          path: artifacts/
          retention-days: 30
